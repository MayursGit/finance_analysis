resources:
  jobs:
    personal_finanace_pipeline:
      name: personal_finanace_pipeline
      email_notifications:
        on_success:
          - mayur10594@gmail.com
        on_failure:
          - mayur10594@gmail.com
      schedule:
        quartz_cron_expression: 29 0 7 2 * ?
        timezone_id: Asia/Calcutta
        pause_status: UNPAUSED
      tasks:
        - task_key: bronze_ingestion
          notebook_task:
            notebook_path: /Workspace/Users/mayur10594@gmail.com/FINANCE/01_bronze_transactions
            source: WORKSPACE
        - task_key: silver_transformations
          depends_on:
            - task_key: bronze_ingestion
          notebook_task:
            notebook_path: /Workspace/Users/mayur10594@gmail.com/FINANCE/02_silver_transactions
            source: WORKSPACE
        - task_key: gold_transformations
          depends_on:
            - task_key: silver_transformations
          notebook_task:
            notebook_path: /Workspace/Users/mayur10594@gmail.com/FINANCE/03_gold_finance_analysis
            source: WORKSPACE
      queue:
        enabled: true
      parameters:
        - name: load_type
          default: incremental_load
      performance_target: PERFORMANCE_OPTIMIZED
