bundle:
  name: FINANCE

include:
  - Jobs/personal_finanace_pipeline.yml
  - Dashboards/*.yml

variables:
  warehouse_id:
    description: "SQL Warehouse ID"
    default: "5cc9dcededdd5384"

permissions:
  - group_name: users
    level: CAN_MANAGE

targets:

  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-0edfa32f-04b9.cloud.databricks.com
      root_path: /Users/${workspace.current_user.userName}/.bundle/${bundle.name}

  qa:
    workspace:
      host: https://dbc-0edfa32f-04b9.cloud.databricks.com
      root_path: /Users/${workspace.current_user.userName}/.bundle/${bundle.name}

  prod:
    mode: production
    workspace:
      host: https://dbc-0edfa32f-04b9.cloud.databricks.com
      root_path: /Users/${workspace.current_user.userName}/.bundle/${bundle.name}
